{% extends 'home.html' %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card border-0 shadow-lg rounded-4">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <div class="forgot-icon mb-3">
                <i class="bi bi-shield-lock-fill"></i>
              </div>

              <h2 class="fw-bold">Forgot Password</h2>

              <p class="text-muted">Enter your registered email address.

                We'll send you a verification OTP.</p>
            </div>

            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                  {{ message }}

                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
              {% endfor %}
            {% endif %}

            <form method="POST">
              {% csrf_token %}

              <div class="mb-4">
                <label class="form-label fw-semibold">Email Address</label>

                <input type="email" name="email" class="form-control form-control-lg" placeholder="Enter your email" required />
              </div>

              <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-semibold">Send OTP</button>
            </form>

            <div class="text-center mt-4">
              <a href="{% url 'login' %}" class="text-decoration-none">
                <i class="bi bi-arrow-left"></i>

                Back to Login
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
