{% extends 'home.html' %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <div class="reset-icon">
                <i class="bi bi-key-fill"></i>
              </div>

              <h3 class="fw-bold mt-3">Create New Password</h3>

              <p class="text-muted">Enter a strong password for your account.</p>
            </div>

            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
              {% endfor %}
            {% endif %}

            <form method="POST">
              {% csrf_token %}

              <div class="mb-3">
                <label class="fw-semibold">New Password</label>

                <input type="password" name="password" class="form-control form-control-lg" required />
              </div>

              <div class="mb-4">
                <label class="fw-semibold">Confirm Password</label>

                <input type="password" name="confirm_password" class="form-control form-control-lg" required />
              </div>

              <button class="btn btn-primary w-100 py-3 rounded-pill">Update Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <style>
    .reset-icon {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 50%;
      background: #0d6efd;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }
  </style>
{% endblock %}
